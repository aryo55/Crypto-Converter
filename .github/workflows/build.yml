name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project structure
        run: |
          mkdir -p /tmp/src
          cp -r lib /tmp/src/
          cp pubspec.yaml /tmp/src/
          flutter create . --project-name crypto_converter --platforms android
          rm -rf lib pubspec.yaml
          cp -r /tmp/src/lib .
          cp /tmp/src/pubspec.yaml .

      - name: Add internet permission
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-converter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
